services:
  health-dashboard:
    build: .
    ports:
      # Host 5173 -> container 8787: matches the redirect URI already
      # registered on the OAuth client in Google Cloud Console
      # (http://localhost:5173/callback) so no console changes are needed.
      # The container still listens on 8787 internally regardless of host
      # port (see PORT in the Dockerfile/env).
      - "5173:8787"
    env_file:
      # Reuses your existing server/.env (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
      # TOKEN_ENCRYPTION_KEY, WEBHOOK_AUTH_TOKEN, ...). OAUTH_REDIRECT_URI and
      # FRONTEND_ORIGIN in it should stay pointed at :5173 to match the host
      # port above — see README.
      - server/.env
    volumes:
      - health-data:/app/data
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      # frser-sqlite-datasource is a community plugin (unsigned) — this
      # explicitly allow-lists it rather than disabling signature
      # verification globally.
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=frser-sqlite-datasource
    volumes:
      # Read-only: Grafana only ever queries this file, never writes to it.
      - health-data:/data:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - health-dashboard
    restart: unless-stopped

volumes:
  health-data:
